name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, the tool called and its arguments. Never paste your API key.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Cursor 2.x, VS Code 1.x, ...
  - type: input
    id: version
    attributes:
      label: "@5sim-net/mcp version and Node.js version"
